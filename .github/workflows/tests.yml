name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Ruff lint
        run: ruff check .
        continue-on-error: true  # egyelore informativ, nem blokkolo

      - name: Run pytest
        run: pytest tests/ -v

      - name: Verify server builds and registers all tools
        run: python -m android_control_mcp --list-tools
