[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-control-mcp"
version = "0.1.0"
description = "Android Control MCP - komplett Android eszkoz-vezerlo MCP szerver ADB-n keresztul (UI automatizalas, kepernyokep/tukrozes, alkalmazaskezeles, fajlok, naplok) beepitett engedely-rendszerrel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Vollai Roland" }]
keywords = ["mcp", "android", "adb", "mobile-automation", "qa", "uiautomator"]

dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8"]
# KISERLETI, opt-in gyorsitott bemenet (lasd android_control_mcp/backends.py) -
# csak akkor aktivalodik, ha az ANDROID_CONTROL_SCRCPY=1 IS be van kapcsolva.
scrcpy = ["scrcpy-client>=0.4"]
# Opcionalis OCR-fallback (lasd android_control_mcp/ocr.py) elemzetlen/WebView/
# Canvas kepernyokhoz, ahol az uiautomator nem lat hasznalhato elemeket. A
# Tesseract OCR motor binarisat KULON, rendszerszinten kell telepiteni.
ocr = ["pytesseract>=0.3.10", "Pillow>=10"]

[project.scripts]
android-control-mcp = "android_control_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["android_control_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
